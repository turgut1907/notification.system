global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9090"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9090"]
